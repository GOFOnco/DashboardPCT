        window.onQCSelect = function(batchNumber) {
            selectedBatch['QC'] = batchNumber;
            const container = document.getElementById('detailContainer_QC');
            if (container) {
                if (batchNumber) {
                    container.innerHTML = renderQCDetail(batchNumber);
                } else {
                    container.innerHTML = '<div class="empty-state">👆 Pilih batch di atas untuk melihat detail</div>';
                }
            }
        };

        function renderQCDetail(batchNumber) {
            const allBatches = [...data.injeksi, ...data.oral];
            const batch = allBatches.find(b => b.batchNumber === batchNumber);
            if (!batch) return '<div class="empty-state">Batch tidak ditemukan</div>';

            const varian = batch.varian;
            const label = getVarianLabel(varian);
            const subNames = QC_SUB[varian] || QC_SUB.injeksi;

            let steps = '';
            const currentStep = batch.currentStep || 0;
            for (let i = 0; i < subNames.length; i++) {
                const sp = batch.subProses[i] || { name: subNames[i], status: 'BELUM', startTime: null, endTime: null,
                    problem: '' };
                const isActive = (i === currentStep && batch.status === 'QC');
                const isDone = sp.status === 'DONE';
                const st = sp.status || 'BELUM';
                const cls = getStepClass(st);
                const dur = sp.startTime && sp.endTime ? formatDurationDays(daysDiff(sp.startTime, sp.endTime)) :
                    sp.startTime && isActive ? formatDurationDays(daysDiff(sp.startTime, new Date().toISOString())) +
                    ' (running)' :
                    '-';

                const statusLabel = getStepStatusLabel(st);
                const statusClass = getStepStatusClass(st);
                const isDisabled = isDone;

                steps += `
              <div class="step-box ${cls}">
                <div class="flex flex-wrap items-start justify-between gap-2">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="font-medium text-sm">${i+1}. ${subNames[i]}</span>
                    <span class="step-status-badge ${statusClass}">${statusLabel}</span>
                    ${dur !== '-' ? `<span class="text-xs text-slate-400">⏱ ${dur} hari</span>` : ''}
                  </div>
                  <div class="flex flex-wrap items-center gap-2">
                    <input type="text" class="input-text input-problem" 
                           data-stage="QC"
                           data-varian="${varian}" 
                           data-batch="${batch.batchNumber}" 
                           data-step="${i}" 
                           value="${sp.problem || ''}" 
                           placeholder="Problem..."
                           style="max-width:200px;font-size:0.7rem;"
                           ${isDisabled ? 'disabled' : ''} />
                    ${isActive && !isDone ? `<button class="btn btn-blue btn-next" 
                                data-stage="QC"
                                data-varian="${varian}" 
                                data-batch="${batch.batchNumber}" 
                                data-step="${i}">Next →</button>` : ''}
                    ${st === 'PROBLEM' && !isActive && !isDone ? `<span class="text-xs text-red-600 font-semibold">⚠️ Problem</span>` : ''}
                  </div>
                </div>
                ${sp.problem && !isDone ? `<div class="text-xs text-red-600 mt-0.5">📌 ${sp.problem}</div>` : ''}
                ${sp.problem && isDone ? `<div class="text-xs text-slate-400 mt-0.5">📌 ${sp.problem}</div>` : ''}
              </div>
            `;
            }

            const qc = batch.qc || {};
            const qcDur = getStageDuration(batch, 'QC');
            const targetQC = getTarget(batch, 'QC');

            const isOral = varian === 'oral';
            let extraFields = '';
            if (isOral) {
                extraFields = `
              <div class="stage-item">
                <div class="stage-label">Analisa Kimia</div>
                <div class="stage-value">${formatDateDisplay(qc.analisaKimia) || '-'}</div>
              </div>
              <div class="stage-item">
                <div class="stage-label">Analisa Mikro</div>
                <div class="stage-value">${formatDateDisplay(qc.analisaMikro) || '-'}</div>
              </div>
              <div class="stage-item">
                <div class="stage-label">Selisih Mikro-Kimia</div>
                <div class="stage-value">${qc.analisaKimia && qc.analisaMikro ? formatDurationDays(daysDiff(qc.analisaKimia, qc.analisaMikro)) : '-'}</div>
              </div>
            `;
            } else {
                extraFields = `
              <div class="stage-item">
                <div class="stage-label">Analisa Mikro</div>
                <div class="stage-value">${formatDateDisplay(qc.analisaMikro) || '-'}</div>
              </div>
            `;
            }

            const pct = getPCTSite(batch, true);
            const targetPct = getTarget(batch, 'PCT_INC');
            const pctOnGoing = getPCTOnGoing(batch);
            const targetOngoing = getTarget(batch, 'PCT_ONGOING');

            return `
            <div class="batch-detail">
              <div class="bg-slate-50 rounded-lg p-3">
                <div class="flex justify-between items-center mb-2">
                  <div>
                    <span class="font-bold text-base">${batch.batchNumber}</span>
                    <span class="text-xs ml-2 text-slate-500">${label}</span>
                    <span class="ml-2 varian-badge ${getVarianBadge(varian)}">${label}</span>
                  </div>
                  <span class="${getStatusBadge(batch.status)}">${getStatusLabel(batch.status)}</span>
                </div>

                ${steps}

                <div class="stage-detail-grid mt-2">
                  <div class="stage-item">
                    <div class="stage-label">Terima Sample</div>
                    <div class="stage-value">${formatDateDisplay(qc.terimaSample) || '-'}</div>
                  </div>
                  <div class="stage-item">
                    <div class="stage-label">Estimasi LWS</div>
                    <div class="stage-value">${qc.estimasiLWS || '-'}</div>
                  </div>
                  ${extraFields}
                  <div class="stage-item">
                    <div class="stage-label">Durasi QC</div>
                    <div class="stage-value ${qcDur !== null && targetQC !== null && qcDur <= targetQC ? 'text-green-600' : qcDur !== null ? 'text-red-600' : 'text-slate-400'}">
                      ${qcDur !== null ? qcDur.toFixed(2) + ' hari' : '-'}
                      ${targetQC !== null ? `/ Target: ${targetQC} hari` : ''}
                    </div>
                  </div>
                </div>

                <div class="flex flex-wrap gap-3 mt-2 pt-2 border-t border-slate-200">
                  <div>
                    <span class="text-xs text-slate-500">PCT Site Inc Mikro</span>
                    <div class="font-bold ${pct !== null && targetPct !== null && pct <= targetPct ? 'text-green-600' : pct !== null ? 'text-red-600' : 'text-slate-400'}">
                      ${pct !== null ? pct.toFixed(2) + ' hari' : '-'}
                      ${targetPct !== null ? `/ Target: ${targetPct} hari` : ''}
                    </div>
                  </div>
                  <div>
                    <span class="text-xs text-slate-500">PCT On Going</span>
                    <div class="font-bold ${pctOnGoing !== null && targetOngoing !== null && pctOnGoing <= targetOngoing ? 'text-green-600' : pctOnGoing !== null ? 'text-red-600' : 'text-slate-400'}">
                      ${pctOnGoing !== null ? pctOnGoing.toFixed(2) + ' hari' : '-'}
                      ${targetOngoing !== null ? `/ Target: ${targetOngoing} hari` : ''}
                    </div>
                  </div>
                  <div>
                    <span class="text-xs text-slate-500">Estimasi Rilis</span>
                    <div class="font-bold text-slate-700">${batch.pct?.estRilis || '-'}</div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        // ================================================================
        //  KANBAN
        // ================================================================

        // KANBAN PRODUKSI - REQUEST WADAH & KEMAS
        function renderKanbanProduksi(el) {
            // Batch yang bisa request: status KANBAN_PRODUKSI atau KANBAN_LOGISTIC
            const allBatches = [...data.injeksi, ...data.oral];
            const activeBatches = allBatches.filter(b =>
                b.status === 'KANBAN_PRODUKSI' || b.status === 'KANBAN_LOGISTIC'
            );

            const availableBatches = activeBatches.filter(b => {
                const hasWadah = kanbanRequests.some(k => k.batchNumber === b.batchNumber && k.type === 'WADAH');
                const hasKemas = kanbanRequests.some(k => k.batchNumber === b.batchNumber && k.type === 'KEMAS');
                return !(hasWadah && hasKemas);
            });

            let html = `
            <div class="section-title">📦 Kanban - Permintaan Wadah/Kemas (Produksi)</div>
            <div class="section-subtitle">Request wadah dan kemas untuk batch yang siap produksi</div>

            <div class="card mb-4">
              <div class="request-form">
                <div class="form-group" style="min-width:180px;">
                  <label>Pilih Batch</label>
                  <select id="kanbanBatchSelect" class="input-select" style="min-width:180px;">
                    <option value="">-- Pilih Batch --</option>
                    ${availableBatches.map(b => `<option value="${b.batchNumber}">${b.batchNumber} (${getVarianLabel(b.varian)}) [${b.status}]</option>`).join('')}
                  </select>
                  ${availableBatches.length === 0 ? '<div class="text-xs text-slate-500 mt-0.5">✅ Semua batch sudah request WADAH + KEMAS</div>' : ''}
                </div>
                <div class="form-group">
                  <label>📦 Wadah</label>
                  <div class="form-row">
                    <input type="text" id="wadahDate" class="input-date" value="${getCurrentDate()}" />
                    <input type="text" id="wadahTime" class="input-time" value="${getCurrentTime()}" />
                    <button class="btn btn-blue btn-sm" onclick="addKanbanRequest('WADAH')">Request</button>
                  </div>
                </div>
                <div class="form-group">
                  <label>📦 Kemas</label>
                  <div class="form-row">
                    <input type="text" id="kemasDate" class="input-date" value="${getCurrentDate()}" />
                    <input type="text" id="kemasTime" class="input-time" value="${getCurrentTime()}" />
                    <button class="btn btn-blue btn-sm" onclick="addKanbanRequest('KEMAS')">Request</button>
                  </div>
                </div>
              </div>

              <div id="kanbanList">
                ${renderKanbanList('produksi')}
              </div>
            </div>
          `;
            el.innerHTML = html;
        }

        window.addKanbanRequest = function(type) {
            const sel = document.getElementById('kanbanBatchSelect');
            const batchNumber = sel.value;
            if (!batchNumber) {
                showToast('Pilih batch terlebih dahulu!', 'warning');
                return;
            }

            const dateInput = type === 'WADAH' ? document.getElementById('wadahDate') : document.getElementById('kemasDate');
            const timeInput = type === 'WADAH' ? document.getElementById('wadahTime') : document.getElementById('kemasTime');

            const tanggal = dateInput.value || getCurrentDate();
            const jam = timeInput.value || getCurrentTime();

            if (!/^\d{2}-\d{2}-\d{4}$/.test(tanggal)) {
                showToast('Format tanggal harus DD-MM-YYYY!', 'error');
                return;
            }

            if (kanbanRequests.some(k => k.batchNumber === batchNumber && k.type === type)) {
                showToast(`Batch ini sudah pernah request ${type}!`, 'warning');
                return;
            }

            const allBatches = [...data.injeksi, ...data.oral];
            const batch = allBatches.find(b => b.batchNumber === batchNumber);
            if (!batch) {
                showToast('Batch tidak ditemukan!', 'error');
                return;
            }

            // Cek apakah batch sudah di status yang tepat
            if (batch.status !== 'KANBAN_PRODUKSI' && batch.status !== 'KANBAN_LOGISTIC') {
                showToast('Batch harus di status KANBAN_PRODUKSI atau KANBAN_LOGISTIC!', 'warning');
                return;
            }

            const newRequest = {
                id: Date.now() + Math.random() * 1000,
                batchNumber: batchNumber,
                varian: batch.varian,
                type: type,
                tanggal: tanggal,
                jam: jam,
                status: 'REQUESTED',
                notes: ''
            };

            kanbanRequests.push(newRequest);
            saveData();
            showToast(`✅ Request ${type} untuk ${batchNumber} berhasil`, 'success');

            // Cek apakah sudah lengkap (WADAH + KEMAS)
            checkKanbanComplete(batchNumber);
            render();
        };

        // Fungsi untuk cek apakah WADAH dan KEMAS sudah ready
        function checkKanbanComplete(batchNumber) {
            const hasWadahReady = kanbanRequests.some(k =>
                k.batchNumber === batchNumber && k.type === 'WADAH' && k.status === 'READY'
            );
            const hasKemasReady = kanbanRequests.some(k =>
                k.batchNumber === batchNumber && k.type === 'KEMAS' && k.status === 'READY'
            );

            if (hasWadahReady && hasKemasReady) {
                const allBatches = [...data.injeksi, ...data.oral];
                const batch = allBatches.find(b => b.batchNumber === batchNumber);
                if (batch && (batch.status === 'KANBAN_PRODUKSI' || batch.status === 'KANBAN_LOGISTIC')) {
                    // Pindahkan ke LOGISTIC
                    batch.status = 'LOGISTIC';
                    batch.currentStep = 0;
                    batch.subProses = ['Timbang', 'Serah Terima'].map(name => ({
                        name,
                        status: 'BELUM',
                        startTime: null,
                        endTime: null,
                        problem: ''
                    }));
                    batch.logistic.timbang = null;
                    batch.logistic.serahTerima = null;
                    batch.history.push({ action: 'Kanban Complete', timestamp: new Date().toISOString(),
                        note: `Wadah dan Kemas ready, pindah ke LOGISTIC` });
                    saveData();
                    showToast(`✅ ${batchNumber} - Wadah dan Kemas ready! Pindah ke LOGISTIC`, 'success');
                    render();
                }
            }
        }

        // KANBAN LOGISTIC - RESPON WADAH & KEMAS
        function renderKanbanLogistic(el) {
            let html = `
            <div class="section-title">📦 Kanban - Respon Wadah/Kemas (Logistic)</div>
            <div class="section-subtitle">Respon permintaan wadah dan kemas dari produksi</div>

            <div class="card mb-4">
              <div id="kanbanList">
                ${renderKanbanList('logistic')}
              </div>
            </div>
          `;
            el.innerHTML = html;
        }

        function renderKanbanList(role) {
            if (kanbanRequests.length === 0) {
                return '<div class="empty-state">Belum ada permintaan kanban</div>';
            }

            let cards = '';
            const sorted = [...kanbanRequests].sort((a, b) => {
                const order = { 'REQUESTED': 0, 'PROBLEM': 1, 'READY': 2 };
                return (order[a.status] || 0) - (order[b.status] || 0);
            });

            for (const req of sorted) {
                const isRequested = req.status === 'REQUESTED';
                const isReady = req.status === 'READY';
                const isProblem = req.status === 'PROBLEM';
                const typeLabel = req.type === 'WADAH' ? '📦 Wadah' : '📦 Kemas';
                const typeBadge = req.type === 'WADAH' ? 'badge-wadah' : 'badge-kemas';

                let actions = '';
                if (role === 'logistic') {
                    if (isRequested) {
                        actions = `
                      <button class="btn btn-green btn-sm" onclick="responseKanban(${req.id}, 'READY')">✅ Ready</button>
                      <button class="btn btn-red btn-sm" onclick="responseKanban(${req.id}, 'PROBLEM')">⚠️ Problem</button>
                      <input type="text" class="input-text" id="notes_${req.id}" placeholder="Notes..." value="${req.notes || ''}" style="max-width:150px;font-size:0.7rem;" onchange="updateKanbanNotes(${req.id}, this.value)" />
                    `;
                    } else if (isProblem) {
                        actions = `
                      <button class="btn btn-green btn-sm" onclick="responseKanban(${req.id}, 'READY')">✅ Ready</button>
                      <span class="text-xs text-red-600 font-semibold">⚠️ Problem</span>
                      <input type="text" class="input-text" id="notes_${req.id}" placeholder="Notes..." value="${req.notes || ''}" style="max-width:150px;font-size:0.7rem;" onchange="updateKanbanNotes(${req.id}, this.value)" />
                    `;
                    } else if (isReady) {
                        actions = `
                      <span class="text-xs text-green-600 font-semibold">✅ Siap</span>
                      ${req.notes ? `<span class="text-xs text-slate-500">📌 ${req.notes}</span>` : ''}
                    `;
                    }
                } else {
                    // Produksi role
                    if (isReady) {
                        actions = `<span class="text-xs text-green-600 font-semibold">✅ Siap - ${req.notes || ''}</span>`;
                    } else if (isProblem) {
                        actions = `<span class="text-xs text-red-600 font-semibold">⚠️ Problem - ${req.notes || ''}</span>`;
                    } else {
                        actions = `<span class="text-xs text-yellow-600 font-semibold">⏳ Menunggu Respon</span>`;
                    }
                }

                const statusBadge = getKanbanStatusBadge(req.status);
                const statusLabel = getKanbanStatusLabel(req.status);

                cards += `
              <div class="kanban-card">
                <div class="kanban-info">
                  <div>
                    <span class="label">Batch</span>
                    <div class="value">${req.batchNumber}</div>
                  </div>
                  <div>
                    <span class="label">Varian</span>
                    <div class="value"><span class="varian-badge ${getVarianBadge(req.varian)}">${getVarianLabel(req.varian)}</span></div>
                  </div>
                  <div>
                    <span class="label">Type</span>
                    <div class="value"><span class="badge-type ${typeBadge}">${typeLabel}</span></div>
                  </div>
                  <div>
                    <span class="label">Tanggal</span>
                    <div class="value">${req.tanggal}</div>
                  </div>
                  <div>
                    <span class="label">Jam</span>
                    <div class="value">${req.jam}</div>
                  </div>
                  <div>
                    <span class="label">Status</span>
                    <div class="value"><span class="${statusBadge}">${statusLabel}</span></div>
                  </div>
                </div>
                <div class="kanban-actions">
                  ${actions}
                  ${role === 'logistic' ? `<button class="btn btn-gray btn-xs" onclick="deleteKanban(${req.id})">✕</button>` : ''}
                </div>
                ${req.notes && role === 'logistic' && isReady ? `<div class="kanban-notes ready">📌 ${req.notes}</div>` : ''}
                ${req.notes && role === 'logistic' && isProblem ? `<div class="kanban-notes">📌 ${req.notes}</div>` : ''}
              </div>
            `;
            }

            return cards;
        }

        // RESPON KANBAN DARI LOGISTIC
        window.responseKanban = function(id, status) {
            const req = kanbanRequests.find(k => k.id === id);
            if (req) {
                req.status = status;
                saveData();
                showToast(`✅ Kanban ${req.type} untuk ${req.batchNumber} = ${status}`, 'success');

                // Cek apakah sudah lengkap (WADAH + KEMAS)
                checkKanbanComplete(req.batchNumber);
                render();
            }
        };

        window.updateKanbanNotes = function(id, notes) {
            const req = kanbanRequests.find(k => k.id === id);
            if (req) {
                req.notes = notes;
                saveData();
            }
        };

        window.deleteKanban = function(id) {
            if (confirm('Hapus permintaan ini?')) {
                kanbanRequests = kanbanRequests.filter(k => k.id !== id);
                saveData();
                showToast('🗑️ Kanban dihapus', 'warning');
                render();
            }
        };

        // ================================================================
        //  EVENTS
        // ================================================================

        function setupEvents() {
            document.addEventListener('click', function(e) {
                const btn = e.target.closest('.btn-next');
                if (!btn) return;

                const varian = btn.dataset.varian;
                const batchNumber = btn.dataset.batch;
                const stepIndex = parseInt(btn.dataset.step);
                const stage = btn.dataset.stage;

                let batch = null;
                if (data[varian]) {
                    batch = data[varian].find(b => b.batchNumber === batchNumber);
                }
                if (!batch) {
                    showToast('Batch tidak ditemukan!', 'error');
                    return;
                }

                // ===== QA SPECIAL =====
                if (stage === 'QA') {
                    if (batch.status === 'DONE') {
                        showToast('Batch sudah release!', 'warning');
                        return;
                    }
                    if (batch.status !== 'QA') {
                        showToast('Batch belum siap untuk release!', 'warning');
                        return;
                    }
                    batch.qa.release = new Date().toISOString();
                    batch.status = 'DONE';
                    if (!batch.subProses || batch.subProses.length === 0) {
                        batch.subProses = [{ name: 'Release Finished Good', status: 'DONE', startTime: batch.qa
                                .release, endTime: batch.qa.release, problem: '' }];
                    } else {
                        batch.subProses[0] = { name: 'Release Finished Good', status: 'DONE', startTime: batch.qa
                                .release, endTime: batch.qa.release, problem: batch.subProses[0]?.problem ||
                            '' };
                    }
                    batch.currentStep = 0;
                    batch.history.push({ action: 'Completed', timestamp: batch.qa.release,
                        note: `Batch ${batchNumber} selesai dan release` });
                    saveData();
                    showToast(`✅ Batch ${batchNumber} telah release!`, 'success');
                    render();
                    return;
                }

                // ===== QC SPECIAL =====
                if (stage === 'QC') {
                    if (!batch.subProses || batch.subProses.length === 0) {
                        const subNames = QC_SUB[batch.varian] || QC_SUB.injeksi;
                        batch.subProses = subNames.map(name => ({ name, status: 'BELUM', startTime: null,
                            endTime: null, problem: '' }));
                    }

                    const step = batch.subProses[stepIndex];
                    if (!step) {
                        showToast('Step tidak ditemukan!', 'error');
                        return;
                    }
                    if (step.status === 'DONE') {
                        showToast('Step sudah selesai!', 'warning');
                        return;
                    }

                    step.endTime = new Date().toISOString();
                    step.status = 'DONE';

                    const stepName = step.name;
                    if (stepName === 'Terima Sample') {
                        batch.qc.terimaSample = step.startTime;
                    } else if (stepName === 'Analisa Kimia') {
                        batch.qc.analisaKimia = step.endTime;
                    } else if (stepName === 'Analisa Mikro') {
                        batch.qc.analisaMikro = step.endTime;
                    } else if (stepName === 'Release Sample') {
                        batch.qc.releaseSample = step.endTime;
                    }

                    const nextIdx = stepIndex + 1;
                    if (nextIdx < batch.subProses.length) {
                        const nextStep = batch.subProses[nextIdx];
                        nextStep.status = 'ON PROGRESS';
                        nextStep.startTime = new Date().toISOString();
                        batch.currentStep = nextIdx;
                        showToast(`✅ Step ${stepName} selesai, lanjut ke ${nextStep.name}`, 'success');
                    } else {
                        batch.currentStep = 0;
                        batch.status = 'QA';
                        batch.subProses = [{ name: 'Release Finished Good', status: 'BELUM', startTime: null,
                            endTime: null, problem: '' }];
                        batch.qa.release = null;
                        batch.history.push({ action: 'QC Complete', timestamp: new Date().toISOString(),
                            note: `Batch ${batchNumber} selesai QC, pindah ke QA` });
                        selectedBatch['QC'] = null;
                        showToast(`✅ Batch ${batchNumber} selesai QC, pindah ke QA`, 'success');
                    }

                    saveData();

                    const selQC = document.getElementById('batchSelect_QC');
                    if (selQC) {
                        const allBatches = [...data.injeksi, ...data.oral].filter(b => b.status === 'QC');
                        selQC.innerHTML = '<option value="">-- Pilih Batch --</option>' +
                            allBatches.map(b =>
                                `<option value="${b.batchNumber}">${b.batchNumber} (${getVarianLabel(b.varian)})</option>`
                                ).join('');
                        selQC.value = '';
                    }

                    render();
                    return;
                }

                // ===== LOGISTIC & PRODUKSI =====
                if (!batch.subProses || batch.subProses.length === 0) {
                    const subNames = (stage === 'LOGISTIC') ? ['Timbang', 'Serah Terima'] :
                        (SUB_PROSES[batch.varian] || SUB_PROSES.injeksi);
                    batch.subProses = subNames.map(name => ({ name, status: 'BELUM', startTime: null, endTime: null,
                        problem: '' }));
                }

                const step = batch.subProses[stepIndex];
                if (!step) {
                    showToast('Step tidak ditemukan!', 'error');
                    return;
                }
                if (step.status === 'DONE') {
                    showToast('Step sudah selesai!', 'warning');
                    return;
                }

                step.endTime = new Date().toISOString();
                step.status = 'DONE';

                if (stage === 'LOGISTIC') {
                    if (step.name === 'Timbang') {
                        batch.logistic.timbang = step.startTime;
                    } else if (step.name === 'Serah Terima') {
                        batch.logistic.serahTerima = step.endTime;
                    }
                } else if (stage === 'PRODUKSI') {
                    const subNames = SUB_PROSES[batch.varian] || SUB_PROSES.injeksi;
                    if (step.name === subNames[0]) {
                        batch.produksi.bpp = step.startTime;
                    }
                    if (step.name === subNames[subNames.length - 1]) {
                        batch.produksi.kirimDok = step.endTime;
                    }
                }

                const nextIdx = stepIndex + 1;
                if (nextIdx < batch.subProses.length) {
                    const nextStep = batch.subProses[nextIdx];
                    nextStep.status = 'ON PROGRESS';
                    nextStep.startTime = new Date().toISOString();
                    batch.currentStep = nextIdx;
                    showToast(`✅ Step ${step.name} selesai, lanjut ke ${nextStep.name}`, 'success');
                } else {
                    batch.currentStep = 0;
                    const nextStatus = getNextStage(batch.status);
                    batch.status = nextStatus;
                    batch.history.push({ action: `${stage} Complete`, timestamp: new Date().toISOString(),
                        note: `Batch ${batchNumber} pindah ke ${nextStatus}` });

                    if (nextStatus === 'PRODUKSI') {
                        const subNames = SUB_PROSES[batch.varian] || SUB_PROSES.injeksi;
                        batch.subProses = subNames.map(name => ({ name, status: 'BELUM', startTime: null,
                            endTime: null, problem: '' }));
                    } else if (nextStatus === 'QC') {
                        const subNames = QC_SUB[batch.varian] || QC_SUB.injeksi;
                        batch.subProses = subNames.map(name => ({ name, status: 'BELUM', startTime: null,
                            endTime: null, problem: '' }));
                    } else if (nextStatus === 'QA') {
                        batch.subProses = [{ name: 'Release Finished Good', status: 'BELUM', startTime: null,
                            endTime: null, problem: '' }];
                    }
                    showToast(`✅ Batch ${batchNumber} pindah ke ${nextStatus}`, 'success');
                }

                saveData();

                const sel = document.getElementById(`batchSelect_${stage}`);
                if (sel) sel.value = batchNumber;
                if (stage === 'QC') {
                    const selQC = document.getElementById('batchSelect_QC');
                    if (selQC) selQC.value = batchNumber;
                }

                render();
            });

            document.addEventListener('change', function(e) {
                const inp = e.target.closest('.input-problem');
                if (!inp || inp.disabled) return;

                const varian = inp.dataset.varian;
                const batchNumber = inp.dataset.batch;
                const stepIndex = parseInt(inp.dataset.step);
                const stage = inp.dataset.stage;

                let batch = null;
                if (data[varian]) {
                    batch = data[varian].find(b => b.batchNumber === batchNumber);
                }
                if (!batch) return;

                if (!batch.subProses || batch.subProses.length === 0) return;
                const step = batch.subProses[stepIndex];
                if (!step || step.status === 'DONE') return;

                step.problem = inp.value;

                if (stage === 'LOGISTIC') {
                    batch.logistic.keterangan = inp.value;
                } else if (stage === 'PRODUKSI') {
                    batch.produksi.keterangan = inp.value;
                } else if (stage === 'QC') {
                    batch.qc.keterangan = inp.value;
                } else if (stage === 'QA') {
                    batch.qa.keterangan = inp.value;
                }

                if (inp.value.trim().length > 0 && step.status !== 'DONE') {
                    step.status = 'PROBLEM';
                    batch.history.push({ action: 'Problem', timestamp: new Date().toISOString(),
                        note: `Problem pada ${step.name}: ${inp.value}` });
                } else if (inp.value.trim().length === 0 && step.status === 'PROBLEM') {
                    step.status = 'ON PROGRESS';
                }

                saveData();

                const stepBox = inp.closest('.step-box');
                if (stepBox) {
                    const statusBadge = stepBox.querySelector('.step-status-badge');
                    if (statusBadge) {
                        const st = step.status || 'BELUM';
                        statusBadge.textContent = getStepStatusLabel(st);
                        statusBadge.className = `step-status-badge ${getStepStatusClass(st)}`;
                    }
                    stepBox.className = `step-box ${getStepClass(step.status)}`;

                    let problemDiv = stepBox.querySelector('.text-red-600.mt-0\\.5');
                    if (step.problem && step.status !== 'DONE') {
                        if (!problemDiv) {
                            problemDiv = document.createElement('div');
                            problemDiv.className = 'text-xs text-red-600 mt-0.5';
                            stepBox.appendChild(problemDiv);
                        }
                        problemDiv.textContent = '📌 ' + step.problem;
                    } else {
                        if (problemDiv) problemDiv.remove();
                    }
                }
            });
        }

        // ================================================================
        //  AUTO REFRESH
        // ================================================================

        function startAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(() => {
                if (currentPage === 'dashboard' || currentPage === 'analytics') {
                    render();
                }
            }, 30000);
        }

        // ================================================================
        //  NAVIGATION
        // ================================================================

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.onclick = function() {
                currentPage = this.dataset.page;
                render();
            };
        });

        // ================================================================
        //  INIT
        // ================================================================

        setupEvents();
        startAutoRefresh();
        render();

        console.log('✅ ALUR PRODUKSI YANG BENAR:');
        console.log('PPIC → KANBAN_PRODUKSI (request wadah/kemas) → KANBAN_LOGISTIC (respon) → LOGISTIC → PRODUKSI → QC → QA → DONE');
        console.log('📦 Total Batch:', data.injeksi.length + data.oral.length);
        console.log('📦 Kanban Requests:', kanbanRequests.length);
        showToast('🚀 Alur: PPIC → Kanban → Logistic → Produksi → QC → QA → Done', 'info', 5000);
    </script>

</body>
</html>
